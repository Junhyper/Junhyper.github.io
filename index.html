<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>銀行員向けAI利活用クイズ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      color: #2c3e50;
    }
    .hidden {
      display: none;
    }
    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
    }
    .question {
      margin-bottom: 25px;
    }
    .question p {
      font-weight: bold;
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #2980b9;
    }
    .result, .score {
      margin-top: 30px;
      padding: 20px;
      background-color: #ecf0f1;
      border-radius: 10px;
    }
    .explanation {
      font-size: 0.9em;
      color: #555;
      margin-top: 5px;
    }
    #back-home {
      display: inline-block;
      margin-top: 20px;
      color: #2980b9;
      text-decoration: underline;
      cursor: pointer;
    }
    #print-button {
      margin-left: 10px;
      background-color: #2ecc71;
    }
    #print-button:hover {
      background-color: #27ae60;
    }
    @media print {
      #back-home, button, #print-button {
        display: none !important;
      }
      body {
        background: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div id="startPage" class="container">
    <h1>銀行員向けAI利活用クイズ</h1>
    <p>全10問。AIの知識を気軽にチェックしてみましょう。</p>
    <button onclick="startQuiz()">テストを開始する</button>
  </div>

  <div id="quizPage" class="container hidden">
    <h1>AI利活用クイズ</h1>
    <form id="quizForm"></form>
    <div id="result" class="result"></div>
    <div id="score" class="score"></div>
    <button id="print-button" onclick="window.print()">結果を印刷する</button>
    <a id="back-home" onclick="goHome()">トップページに戻る</a>
  </div>

  <script>
    const questions = [
      {
        q: "Q1. AIとは何の略でしょうか？",
        name: "q1",
        correct: "Artificial Intelligence",
        explanation: "AIはArtificial Intelligence（人工知能）の略です。",
        choices: ["Artificial Intelligence", "Automatic Integration", "Advanced Internet"]
      },
      {
        q: "Q2. AIの活用が期待されている業務は？",
        name: "q2",
        correct: "顧客対応、融資審査、文書作成など幅広い業務",
        explanation: "AIは多くの業務で活用が期待されています。",
        choices: ["書類の電子化のみ", "顧客対応、融資審査、文書作成など幅広い業務", "接客業務だけ"]
      },
      {
        q: "Q3. 機械学習とは何ですか？",
        name: "q3",
        correct: "データから学習して予測や判断を行う技術",
        explanation: "機械学習はAIの一分野で、データから学習して予測を行います。",
        choices: ["手作業の自動化技術", "パソコンの自動更新", "データから学習して予測や判断を行う技術"]
      },
      {
        q: "Q4. AIチャットボットの特徴は？",
        name: "q4",
        correct: "自動応答が可能で24時間対応できる",
        explanation: "チャットボットはAIによって自動応答が可能です。",
        choices: ["人間が常に対応する", "自動応答が可能で24時間対応できる", "メールしか対応できない"]
      },
      {
        q: "Q5. ディープラーニングとは？",
        name: "q5",
        correct: "多層のニューラルネットワークを使った学習方法",
        explanation: "ディープラーニングはAIの中でも深層学習と呼ばれています。",
        choices: ["単純なルールベースの手法", "人間の直感を模倣する方法", "多層のニューラルネットワークを使った学習方法"]
      },
      {
        q: "Q6. AIの弱点は？",
        name: "q6",
        correct: "学習データの偏りに影響を受ける",
        explanation: "AIは与えられたデータに依存するため、偏りの影響を受けます。",
        choices: ["自分で情報収集ができる", "常に正しい答えを出せる", "学習データの偏りに影響を受ける"]
      },
      {
        q: "Q7. AIを使う際の倫理的配慮は？",
        name: "q7",
        correct: "プライバシー保護や説明責任の確保",
        explanation: "AI利用時には倫理・責任・公平性が求められます。",
        choices: ["特に必要ない", "すべてAIに任せればよい", "プライバシー保護や説明責任の確保"]
      },
      {
        q: "Q8. 音声認識のAI活用例は？",
        name: "q8",
        correct: "自動文字起こしや電話応対",
        explanation: "音声認識AIは業務効率化に活用されています。",
        choices: ["AIとは関係ない", "自動文字起こしや電話応対", "画面のデザイン作成"]
      },
      {
        q: "Q9. 金融機関におけるAIの利用例は？",
        name: "q9",
        correct: "融資審査の自動化やチャットボットの導入",
        explanation: "AIは金融の現場でも様々な形で活用されています。",
        choices: ["現金管理のみに使う", "ATMのデザイン変更", "融資審査の自動化やチャットボットの導入"]
      },
      {
        q: "Q10. AI活用に関する教育・研修は？",
        name: "q10",
        correct: "全職員に必要",
        explanation: "AIを正しく使うため、全職員への教育が必要です。",
        choices: ["特に不要", "全職員に必要", "管理職だけ必要"]
      }
    ];

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
      document.getElementById("startPage").classList.add("hidden");
      document.getElementById("quizPage").classList.remove("hidden");

      const form = document.getElementById("quizForm");
      form.innerHTML = "";
      questions.forEach((q, i) => {
        const div = document.createElement("div");
        div.className = "question";
        div.innerHTML = `<p>${q.q}</p>`;
        const shuffled = shuffle([...q.choices]);
        shuffled.forEach(choice => {
          div.innerHTML += `<label><input type="radio" name="${q.name}" value="${choice}"> ${choice}</label>`;
        });
        form.appendChild(div);
      });
      form.innerHTML += '<button type="button" onclick="checkAnswers()">回答を送信</button>';
    }

    function goHome() {
      document.getElementById("quizForm").reset();
      document.getElementById("result").innerHTML = "";
      document.getElementById("score").innerHTML = "";
      document.getElementById("quizPage").classList.add("hidden");
      document.getElementById("startPage").classList.remove("hidden");
    }

    function checkAnswers() {
      let score = 0;
      let resultText = "";
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name=${q.name}]:checked`);
        const isCorrect = selected && selected.value === q.correct;
        if (isCorrect) score++;
        resultText += `<p><strong>Q${i+1}:</strong> ${isCorrect ? "正解" : "不正解"}<br><span class="explanation">${q.explanation}</span></p>`;
      });
      document.getElementById("result").innerHTML = resultText;
      document.getElementById("score").textContent = `あなたのスコア: ${score} / ${questions.length}点`;
    }
  </script>
</body>
</html>
