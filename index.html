<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI利活用クイズ（銀行員向け）</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <!-- スタート画面 -->
    <section id="start-screen">
      <h1>AI利活用クイズ</h1>
      <p>銀行業務に関するAIの利活用について、全9問のクイズに挑戦しましょう。</p>
      <button onclick="startQuiz()">テストを開始する</button>
    </section>

    <!-- クイズ画面 -->
    <section id="quiz-container" class="hidden">
      <h2 id="question">問題がここに表示されます</h2>
      <ul id="options"></ul>
      <p id="explanation"></p>
      <div class="button-row">
        <button onclick="submitAnswer()">回答する</button>
        <button id="next-button" onclick="nextQuestion()" disabled>次の問題へ</button>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="hidden">
      <h2>結果発表</h2>
      <p>あなたのスコア: <strong id="score"></strong></p>
      <button onclick="printResult()">結果を印刷する</button>
      <button onclick="goToStart()">トップページに戻る</button>
    </section>
  </div>
</body>
</html>
