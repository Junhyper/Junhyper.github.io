<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI利活用クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 開始画面 -->
  <div id="start-screen">
    <h1>AI利活用クイズ</h1>
    <p>テストを開始するには、下のボタンをクリックしてください。</p>
    <button onclick="startQuiz()">テストを開始する</button>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz-container" class="hidden">
    <h2 id="question"></h2>
    <ul id="options"></ul>
    <div id="buttons">
      <button id="previous-button" onclick="previousQuestion()" disabled>前の問題に戻る</button>
      <button id="next-button" onclick="nextQuestion()">次の問題へ</button>
    </div>
    <div id="explanation"></div>
  </div>

  <!-- 結果送信画面 -->
  <div id="submit-screen" class="hidden">
    <button id="submit-result-button" onclick="submitResult()">結果を送信する</button>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="hidden">
    <h2>クイズの結果</h2>
    <p id="score"></p>
    <div id="explanation-container"></div>
    <button onclick="goToStart()">トップページに戻る</button>
    <button onclick="printResult()">結果を印刷</button>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
