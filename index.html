<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI利活用クイズ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- スタート画面 -->
    <section id="start-screen" class="screen active">
      <h1>AI利活用クイズ</h1>
      <p>AIに関する知識をテストしてみましょう！</p>
      <button id="start-btn" class="btn">テストを開始する</button>
    </section>

    <!-- クイズ画面 -->
    <section id="quiz-screen" class="screen">
      <div id="question-area">
        <h2 id="question-title"></h2>
        <form id="options-form"></form>
      </div>
      <div class="navigation">
        <button id="prev-btn" class="btn secondary">前の問題に戻る</button>
        <button id="next-btn" class="btn">次の問題へ</button>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="screen">
      <h2>結果発表</h2>
      <p id="score-text"></p>
      <div id="explanations"></div>
      <div class="navigation">
        <button onclick="window.print()" class="btn">結果を印刷</button>
        <button id="restart-btn" class="btn secondary">トップページに戻る</button>
      </div>
    </section>

  </div>
  <script src="script.js" defer></script>
</body>
</html>
